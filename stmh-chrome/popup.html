<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视听魔盒</title>
    <link rel="stylesheet" href="css/toolbox.css" />
    <script type="module" src="js/popup.js"></script>
  </head>
  <body class="popup">
    <header class="popup-header">
      <span class="brand-mark" aria-hidden="true">m<span>•</span></span
      ><span class="brand-name">视听魔盒<small>MEDIA TOOLBOX</small></span
      ><span class="version">1.0</span>
    </header>
    <main>
      <p class="eyebrow">TAKE A LITTLE BREAK</p>
      <h1>给日常，留点好时光<span class="orange">。</span></h1>
      <p class="muted intro">听一首歌，看一段影片，换一张壁纸。</p>
      <div class="launch-grid">
        <a
          class="launch-card"
          href="toolbox.html?tool=music"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">♫</span
          ><strong>听点音乐</strong><small>本地歌单 · 进度记忆</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
        <a
          class="launch-card"
          href="toolbox.html?tool=video"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">▷</span
          ><strong>看段视频</strong><small>本地播放 · 画面截图</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
        <a
          class="launch-card"
          href="toolbox.html?tool=wallpaper"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">◒</span
          ><strong>换个心情</strong><small>壁纸生成 · 4K 导出</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
        <a
          class="launch-card"
          href="toolbox.html?tool=navigation"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">⌘</span
          ><strong>随手直达</strong><small>常用网站 · 自定义收藏</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
      </div>
      <button id="save-current" class="secondary wide">＋ 收藏当前网页</button>
      <p id="feedback" role="status" class="feedback"></p>
    </main>
    <footer class="popup-footer">
      <span><i class="status-dot"></i>核心功能离线可用</span
      ><a
        href="https://github.com/zcjunblog/stmh-chrome-Browser-extensions"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub ↗</a
      >
    </footer>
  </body>
</html>
