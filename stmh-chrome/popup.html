<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视听魔盒</title>
    <link rel="stylesheet" href="css/toolbox.css" />
    <script type="module" src="js/popup.js"></script>
  </head>
  <body class="popup">
    <header class="popup-header">
      <span class="brand-mark" aria-hidden="true">m<span>•</span></span
      ><span class="brand-name">视听魔盒<small>MEDIA TOOLBOX</small></span
      ><span class="version">1.1</span>
    </header>
    <main>
      <p class="eyebrow">TAKE A LITTLE BREAK</p>
      <h1>视频网页，一键解析<span class="orange">。</span></h1>
      <p class="muted intro">在视频播放页使用，无需导入文件。</p>
      <div class="launch-grid">
        <a
          class="launch-card"
          href="toolbox.html?tool=music"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">♫</span
          ><strong>听点音乐</strong><small>本地歌单 · 进度记忆</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
        <button id="parse-current" class="launch-card" type="button" disabled>
          <span class="tool-symbol" aria-hidden="true">▷</span
          ><strong>一键解析</strong
          ><small id="current-video">识别当前视频网页…</small
          ><span class="card-arrow" aria-hidden="true">↗</span>
        </button>
        <a
          class="launch-card"
          href="toolbox.html?tool=wallpaper"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">◒</span
          ><strong>换个心情</strong><small>壁纸生成 · 4K 导出</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
        <a
          class="launch-card"
          href="toolbox.html?tool=navigation"
          target="_blank"
          rel="noopener"
          ><span class="tool-symbol" aria-hidden="true">⌘</span
          ><strong>随手直达</strong><small>常用网站 · 自定义收藏</small
          ><span class="card-arrow" aria-hidden="true">↗</span></a
        >
      </div>
      <p class="parser-link">
        <a href="parser.html" target="_blank" rel="noopener"
          >粘贴视频网址 / 查看内置线路 ↗</a
        >
      </p>
      <button id="save-current" class="secondary wide">＋ 收藏当前网页</button>
      <p id="feedback" role="status" class="feedback"></p>
    </main>
    <footer class="popup-footer">
      <span><i class="status-dot"></i>解析线路：TXNP（第三方）</span
      ><a
        href="https://github.com/zcjunblog/stmh-chrome-Browser-extensions"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub ↗</a
      >
    </footer>
  </body>
</html>
