name: Verify extension
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: stmh-toolbox
          path: dist/
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
